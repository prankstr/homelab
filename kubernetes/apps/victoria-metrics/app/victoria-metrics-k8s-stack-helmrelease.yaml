apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
  namespace: victoria-metrics
spec:
  interval: 10m
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.93.0
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
      interval: 1h
  releaseName: victoria-metrics-k8s-stack
  values:
    fullnameOverride: "victoria-metrics-k8s-stack"
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    defaultRules:
      disabled:
        Watchdog: true
    vmsingle:
      spec:
        retentionPeriod: "1" # month
        resources:
          requests:
            memory: "1.5Gi"
            cpu: "100m"
        storage:
          resources:
            requests:
              storage: 30Gi
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: "letsencrypt"
          nginx.ingress.kubernetes.io/proxy-body-size: 1g
        ingressClassName: nginx
        hosts:
          - metrics.${my_domain}
        tls:
          - secretName: metrics.${my_domain}-cert
            hosts:
              - metrics.${my_domain}
    vmagent:
      spec:
        externalLabels:
          cluster: "molntuss-k8s"
        resources:
          limits:
            memory: "200Mi"
          requests:
            cpu: "200m"
            memory: "200Mi"
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: "letsencrypt"
        ingressClassName: nginx
        hosts:
          - vmagent.${my_domain}
        tls:
          - secretName: vmagent.${my_domain}-cert
            hosts:
              - vmagent.${my_domain}
    vmalert:
      spec:
        resources:
          limits:
            memory: "200Mi"
          requests:
            cpu: "100m"
            memory: "100Mi"
    alertmanager:
      spec:
        configSecret: "alertmanager-config"
      templateFiles:
        telegram.yaml: |-
          {{/* Telegram rejects messages over 4096 chars, so show at most 3 alerts
               per section and skip labels that are noise in a chat message. */}}
          {{ define "__alert" }}
          <b>{{ .Labels.alertname }}</b>
          {{- if .Annotations.summary }}
          Summary: {{ .Annotations.summary }}
          {{- end }}
          {{- if .Annotations.description }}
          Description: {{ .Annotations.description }}
          {{- end }}
          Labels:{{ range .Labels.SortedPairs }}{{ if not (match "^(alertname|alertgroup|cluster|prometheus|endpoint|service|container|victoriametrics_app|job)$" .Name) }} <i>{{ .Name }}</i>=<code>{{ .Value }}</code>{{ end }}{{ end }}
          {{- if .Annotations.runbook_url }}
          <a href="{{ .Annotations.runbook_url }}">Runbook</a>
          {{- end }}
          {{ end }}

          {{ define "__alert_list" }}
          {{- range $i, $a := . }}{{ if lt $i 3 }}{{ template "__alert" $a }}{{ end }}{{ end }}
          {{- if gt (len .) 3 }}
          <i>…showing 3 of {{ len . }}, see Alertmanager for the rest</i>
          {{ end }}
          {{- end }}

          {{ define "telegram.message" }}
          {{- if gt (len .Alerts.Firing) 0 }}
          🔥 Alerts Firing ({{ len .Alerts.Firing }}) 🔥
          {{ template "__alert_list" .Alerts.Firing }}
          {{- end }}
          {{- if gt (len .Alerts.Resolved) 0 }}
          ✅ Alerts Resolved ({{ len .Alerts.Resolved }}) ✅
          {{ template "__alert_list" .Alerts.Resolved }}
          {{- end }}
          🛠 <a href="https://alertmanager.${my_domain}/">Alertmanager</a> | <a href="https://grafana.${my_domain}/">Grafana</a> 🛠
          {{ end }}
      ingress:
        enabled: true
        annotations:
          cert-manager.io/cluster-issuer: "letsencrypt"
        ingressClassName: nginx
        hosts:
          - alertmanager.${my_domain}
        tls:
          - secretName: alertmanager.${my_domain}-cert
            hosts:
              - alertmanager.${my_domain}
    grafana:
      enabled: false
      forceDeployDatasource: false
      sidecar:
        dashboards:
          label: "grafana_dashboard"
