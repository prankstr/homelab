apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
spec:
  interval: 10m
  chart:
    spec:
      chart: descheduler
      version: 0.36.0
      sourceRef:
        kind: HelmRepository
        name: descheduler
      interval: 1h
  values:
    kind: Deployment
    resources:
      requests:
        cpu: 10m
        memory: 20Mi
    deschedulerPolicy:
      profiles:
        - name: default
          pluginConfig:
            - name: DefaultEvictor
              args:
                ignorePvcPods: true
                evictLocalStoragePods: true
            - name: RemoveDuplicates
            - name: RemovePodsHavingTooManyRestarts
              args:
                podRestartThreshold: 100
                includingInitContainers: true
            - name: RemovePodsViolatingNodeAffinity
              args:
                nodeAffinityType:
                  - requiredDuringSchedulingIgnoredDuringExecution
            - name: RemovePodsViolatingNodeTaints
            - name: RemovePodsViolatingInterPodAntiAffinity
            - name: RemovePodsViolatingTopologySpreadConstraint
            - name: LowNodeUtilization
              args:
                # Thresholds are relative to the cluster average (percentage points of
                # memory requests) instead of absolute, so they don't need retuning as
                # workloads change. A node is overutilized above avg+15 and underutilized
                # below avg-15. Memory only: a node must be below the lower bound on
                # *every* listed resource to count as underutilized, and cpu/pods rarely
                # deviate that much on 3 nodes, which would make the plugin inert.
                useDeviationThresholds: true
                thresholds:
                  memory: 15
                targetThresholds:
                  memory: 15
          plugins:
            balance:
              enabled:
                - RemoveDuplicates
                - RemovePodsViolatingTopologySpreadConstraint
                - LowNodeUtilization
            deschedule:
              enabled:
                - RemovePodsHavingTooManyRestarts
                - RemovePodsViolatingNodeTaints
                - RemovePodsViolatingNodeAffinity
                - RemovePodsViolatingInterPodAntiAffinity
