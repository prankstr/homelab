apiVersion: batch/v1
kind: CronJob
metadata:
  name: market-data
spec:
  suspend: false
  schedule: "7 * * * *"
  timeZone: Europe/Stockholm
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0 # Next hourly run resumes; avoid duplicate recovery bursts.
      activeDeadlineSeconds: 3300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: market-data
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 120
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: collector
              image: python:3.13.15-slim-bookworm@sha256:ed86c82274b3c69b52fb5820f358f0bd7df0b603332063cb5c6e32bd220c3e6e
              command: [python, -B, /app/collector.py]
              args: [--root, /data, --workers, "4", --request-interval, "0.25", --max-seconds, "2700"]
              env:
                - name: PYTHONUNBUFFERED
                  value: "1"
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: "2"
                  memory: 768Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
                - name: archive
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              secret:
                secretName: market-data-script
                items:
                  - key: collector.py
                    path: collector.py
            - name: archive
              persistentVolumeClaim:
                claimName: market-data
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
